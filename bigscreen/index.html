<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丹邱丝苗米产业运行监管驾驶舱</title>
<script src="echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, rgba(255,252,236,.30), rgba(244,239,211,.24)), url("rice-field-bg.jpg") center / cover fixed no-repeat;
    color: #293a28; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh; overflow: hidden;
  }
  .screen { display: grid; grid-template-rows: 64px 1fr 142px; height: 100vh; padding: 12px 16px; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(100deg, #fffef8, #f3f2df);
    border: 1px solid #cbd6b8; border-radius: 16px; padding: 0 22px; box-shadow: 0 6px 20px rgba(59,80,47,.08); }
  header h1 { font-size: 26px; letter-spacing: 4px; color: #4f713c;
    text-shadow: 0 2px 0 rgba(255,255,255,.7); font-weight: 700; }
  header .right { text-align: right; font-size: 14px; color: #697b5a; }
  header .clock { font-size: 20px; color: #8e713d; font-family: Consolas, monospace; }
  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-height: 0; }
  .panel { border: 1px solid #cbd6b8; border-radius: 16px; background: #fffef8;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(59,80,47,.075); }
  .panel-title { font-size: 15px; padding: 9px 14px; color: #526e3e; letter-spacing: 2px;
    border-bottom: 1px solid #e1e5d1; background: linear-gradient(90deg, rgba(222,232,204,.8), rgba(250,249,239,.65)); }
  .panel-title::before { content: "🌿"; margin-right: 7px; }
  .right-dashboard { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; min-height: 0; }
  .cards { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-content: start; }
  .card { min-width: 0; border: 1px solid #dbe1cb; border-radius: 12px; padding: 9px 10px; background: #fffef8; box-shadow: 0 3px 10px rgba(59,80,47,.05); }
  .card .label { font-size: 13px; color: #526148; font-weight: 600; }
  .card .value { font-size: 21px; font-weight: 700; color: #a27e3e; margin-top: 3px;
    font-family: Consolas, monospace; }
  .card .value small { font-size: 13px; color: #7e8972; font-weight: 400; margin-left: 3px; }
  .card.hl .value { color: #527a43; }
  .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; min-height: 0; }
  .chart-panel { border: 1px solid #dbe1cb; border-radius: 13px; background: rgba(255,254,248,.97); overflow: hidden; min-width: 0; min-height: 0; box-shadow: 0 4px 14px rgba(59,80,47,.055); }
  .chart-title { height: 34px; padding: 8px 12px 4px; color: #526e3e; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  .chart { height: calc(100% - 34px); min-height: 120px; width: 100%; }
  footer { border: 1px solid #cbd6b8; border-radius: 16px; background: #fffef8; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(59,80,47,.075); }
  .ticker { flex: 1; overflow: hidden; position: relative; padding: 6px 0; }
  .ticker ul { list-style: none; animation: scrollUp 26s linear infinite; }
  .ticker li { line-height: 34px; padding: 0 18px; font-size: 14px; font-weight: 500; color: #34412f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticker li .tag { display: inline-block; min-width: 40px; text-align: center; border-radius: 4px;
    margin-right: 10px; padding: 1px 6px; font-size: 12px; background: #e4ecd8; color: #527a43; }
  .ticker li .tag.农事 { background: #e0ead1; color: #476b3d; }
  .ticker li .tag.投保 { background: #f1e7c9; color: #8a6b2e; }
  .ticker li .tag.理赔 { background: #f3dddd; color: #99504a; }
  .ticker li .tag.认养 { background: #e9e1ef; color: #76588b; }
  .ticker li .tag.贷款 { background: #dce9e3; color: #456e62; }
  .ticker li .tag.订单 { background: #f0e2d5; color: #94613b; }
  @keyframes scrollUp { from { transform: translateY(0); } to { transform: translateY(-50%); } }
  .legend { display: flex; gap: 16px; padding: 8px 16px 2px; font-size: 12px; color: #65765a; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  @media (max-width: 1100px) {
    .screen { grid-template-rows: 56px minmax(0, 1fr) 110px; padding: 8px; gap: 8px; }
    main { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .card { padding: 6px 7px; }
    .card .label { font-size: 11px; }
    .card .value { font-size: 16px; }
    .chart-grid { gap: 6px; }
    header h1 { font-size: 19px; letter-spacing: 2px; }
  }
  @media (max-height: 760px) {
    .screen { grid-template-rows: 52px minmax(0, 1fr) 94px; padding: 7px; gap: 7px; }
    .card { padding: 5px 7px; }
    .chart-title { height: 28px; padding-top: 6px; }
    .chart { height: calc(100% - 28px); min-height: 90px; }
    .ticker li { line-height: 26px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="screen">
  <header>
    <h1>丹邱丝苗米产业运行监管驾驶舱</h1>
    <div class="right">
      <div class="clock" id="clock">--:--:--</div>
      <div id="date">----年--月--日</div>
    </div>
  </header>
  <main>
    <div class="right-dashboard">
      <div class="cards" id="cards"></div>
      <div class="chart-grid">
        <section class="chart-panel"><div class="chart-title">近 6 个月 · 农事记录趋势</div><div class="chart" id="chart-record-trend"></div></section>
        <section class="chart-panel"><div class="chart-title">平台销售额趋势（元）</div><div class="chart" id="chart-sales-trend"></div></section>
        <section class="chart-panel"><div class="chart-title">农事类型分布</div><div class="chart" id="chart-record-types"></div></section>
        <section class="chart-panel"><div class="chart-title">认证农户构成</div><div class="chart" id="chart-certifications"></div></section>
      </div>
    </div>
  </main>
  <footer>
    <div class="panel-title">最新业务动态</div>
    <div class="ticker"><ul id="ticker"></ul></div>
  </footer>
</div>

<script>
const API = location.origin.includes('8010') ? '' : 'http://127.0.0.1:8010';
const fmtTime = (t, i) => {
  if (!t) return '';
  const d = new Date(t);
  const p = n => String(n).padStart(2, '0');
  const date = d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  return i ? date + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) : date;
};

function tick() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  document.getElementById('date').textContent = d.getFullYear() + '年' + p(d.getMonth()+1) + '月' + p(d.getDate()) + '日';
}
setInterval(tick, 1000); tick();

const CARD_DEFS = [
  ['certified_farmers', '认证农户', '户', true], ['total_farmers', '农户总数', '户'],
  ['loan_applications', '贷款申请', '笔'], ['approved_loan_amount', '银行放款额', '元', true],
  ['policy_count', '保单数', '份'], ['insured_amount_total', '总保额', '元', true],
  ['paid_claim_amount', '已赔金额', '元', true], ['claim_count', '理赔件数', '件'],
  ['adoption_consumers', '认养消费者', '人', true], ['adoption_count', '认养订单', '单'],
  ['platform_sales_amount', '平台销售额', '元'], ['pending_dividend', '待结算分红', '元'],
  ['production_records', '农事记录', '条'], ['inspection_warnings', '巡检预警', '次'],
];

function renderCards(cards) {
  const box = document.getElementById('cards');
  box.innerHTML = CARD_DEFS.map(([k, label, unit, hl]) => {
    let v = cards[k] ?? 0;
    v = Number(v);
    const text = v >= 10000 ? (v / 10000).toFixed(1) + '<small>万</small>' : Math.round(v * 100) / 100;
    return '<div class="card' + (hl ? ' hl' : '') + '"><div class="label">' + label + '</div><div class="value">' + text + '<small>' + unit + '</small></div></div>';
  }).join('');
}

function certColor(plot) {
  if (plot.cert_status === 'APPROVED') return '#7f9b54';
  if (plot.cert_status === 'PENDING' || plot.cert_status === 'RECTIFYING') return '#d1a64c';
  return '#9eaa85';
}

let mapChart = null;
function renderMap(map) {
  const el = document.getElementById('map');
  if (mapChart) mapChart.dispose();
  const chart = mapChart = echarts.init(el);
  const plots = (map.plots || []).filter(p => p.boundary && p.boundary.coordinates && p.boundary.coordinates[0]);
  let lngs = [], lats = [];
  plots.forEach(p => p.boundary.coordinates[0].forEach(c => { lngs.push(c[0]); lats.push(c[1]); }));
  const pad = Math.max((Math.max(lngs) - Math.min(lngs)) * 0.08, 0.0005);
  const yPad = Math.max((Math.max(lats) - Math.min(lats)) * 0.08, 0.0005);

  chart.setOption({
    tooltip: {
      formatter: params => {
        const p = params.data;
        if (!p || !p.name) return '';
        return '<b>' + p.name + '</b><br/>' + p.village + ' · ' + p.area_mu + ' 亩<br/>品种:' + p.variety +
          '<br/>认证:' + (p.cert_status === 'APPROVED' ? '已认证' : p.cert_status === 'PENDING' ? '认证中' : p.cert_status === 'RECTIFYING' ? '整改中' : p.cert_status === 'REJECTED' ? '未通过' : '未认证') +
          (p.open_for_adoption ? '<br/>⭐ 开放认养' : '');
      }
    },
    grid: { left: 46, right: 20, top: 24, bottom: 40 },
    xAxis: { min: Math.min(...lngs) - pad, max: Math.max(...lngs) + pad, show: false },
    yAxis: { min: Math.min(...lats) - yPad, max: Math.max(...lats) + yPad, show: false },
    dataZoom: [{ type: 'inside' }],
    series: [
      {
        type: 'custom', coordinateSystem: 'cartesian2d',
        data: plots.map(p => ({
          name: p.plot_name, village: p.village, area_mu: p.area_mu, variety: p.variety,
          cert_status: p.cert_status, open_for_adoption: p.open_for_adoption,
          value: [p.longitude, p.latitude],
          poly: p.boundary.coordinates[0], color: certColor(p)
        })),
        renderItem: (params, api) => {
          const points = params.data.poly.map(c => api.coord(c));
          return {
            type: 'polygon',
            shape: { points },
            style: {
              fill: params.data.color, opacity: 0.82,
              stroke: params.data.open_for_adoption ? '#8a7050' : 'rgba(83,101,63,.55)',
              lineWidth: params.data.open_for_adoption ? 2 : 0.8
            },
            emphasisStyle: { fill: '#b4c985', opacity: 1 }
          };
        }
      },
      {
        type: 'scatter', coordinateSystem: 'cartesian2d',
        symbolSize: 0, label: { show: false },
        data: plots.map(p => ({ value: [p.longitude, p.latitude], name: p.plot_name })),
        tooltip: { show: false }
      }
    ]
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderTicker(items) {
  const ul = document.getElementById('ticker');
  const html = items.map(it =>
    '<li><span class="tag ' + it.type + '">' + it.type + '</span>' +
    (it.time ? '[' + fmtTime(it.time, 1) + '] ' : '') + it.text + '</li>'
  ).join('');
  ul.innerHTML = html + html;  // 双份实现无缝滚动
}

const charts = {};
function setChart(id, option) {
  const el = document.getElementById(id);
  if (!charts[id]) charts[id] = echarts.init(el);
  charts[id].setOption(option, true);
}
const chartText = '#59634e';
const axisStyle = { axisLabel: { color: chartText, fontSize: 10 }, axisLine: { lineStyle: { color: '#d7ddc8' } } };
function renderCharts(data) {
  if (!data) return;
  const months = data.months || [];
  const grid = { left: 42, right: 16, top: 16, bottom: 28, containLabel: true };
  setChart('chart-record-trend', {
    color: ['#78965a'], tooltip: { trigger: 'axis' }, grid,
    xAxis: { type: 'category', data: months.map(m => m.slice(5) + '月'), ...axisStyle },
    yAxis: { type: 'value', minInterval: 1, ...axisStyle, splitLine: { lineStyle: { color: '#edf0e5' } } },
    series: [{ type: 'bar', data: data.records || [], barMaxWidth: 25, itemStyle: { borderRadius: [5,5,0,0] }, showBackground: true, backgroundStyle: { color: '#f2f4e9', borderRadius: [5,5,0,0] } }]
  });
  setChart('chart-sales-trend', {
    color: ['#c99a46'], tooltip: { trigger: 'axis', valueFormatter: v => '¥' + Number(v || 0).toLocaleString('zh-CN') }, grid,
    xAxis: { type: 'category', data: months.map(m => m.slice(5) + '月'), ...axisStyle },
    yAxis: { type: 'value', axisLabel: { color: chartText, fontSize: 10, formatter: v => v >= 10000 ? (v / 10000) + '万' : v }, axisLine: { lineStyle: { color: '#d7ddc8' } }, splitLine: { lineStyle: { color: '#edf0e5' } } },
    series: [{ type: 'line', data: data.sales || [], smooth: true, symbol: 'circle', symbolSize: 6, lineStyle: { width: 3 }, areaStyle: { opacity: .16 } }]
  });
  const recordNames = { SOWING: '播种', SEEDLING: '育秧', TRANSPLANTING: '插秧', FERTILIZING: '施肥', PESTICIDE: '打药', IRRIGATION: '灌溉', HARVEST: '收割', QUALITY_TEST: '米质检测' };
  const records = (data.record_types || []).map(item => ({ name: recordNames[item.name] || item.name || '其他', value: Number(item.value || 0) }));
  setChart('chart-record-types', {
    color: ['#668b4f','#d0a44e','#8aa36e','#b77645','#75a09a','#a6b86e','#dfc576','#8d7950'],
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } }, grid: { left: 68, right: 20, top: 8, bottom: 12, containLabel: true },
    xAxis: { type: 'value', minInterval: 1, axisLabel: { color: chartText, fontSize: 10 }, splitLine: { lineStyle: { color: '#edf0e5' } } },
    yAxis: { type: 'category', data: records.map(v => v.name).reverse(), axisLabel: { color: chartText, fontSize: 10 }, axisLine: { show: false }, axisTick: { show: false } },
    series: [{ type: 'bar', data: records.map(v => v.value).reverse(), barMaxWidth: 17, itemStyle: { borderRadius: [0,5,5,0], color: params => ['#668b4f','#d0a44e','#8aa36e','#b77645','#75a09a','#a6b86e','#dfc576','#8d7950'][params.dataIndex % 8] }, label: { show: true, position: 'right', color: chartText, fontSize: 10 } }]
  });
  const certNames = { CERTIFIED: '已认证', PENDING: '待审核', REJECTED: '未通过', UNVERIFIED: '未认证' };
  setChart('chart-certifications', {
    color: ['#668b4f','#d0a44e','#b77645','#a6b86e','#8aa36e'], tooltip: { trigger: 'item', formatter: '{b}：{c} 户（{d}%）' },
    legend: { bottom: 0, left: 'center', textStyle: { color: chartText, fontSize: 10 }, itemWidth: 9, itemHeight: 9 },
    series: [{ type: 'pie', radius: ['38%','66%'], center: ['50%','43%'], avoidLabelOverlap: true,
      itemStyle: { borderColor: '#fffef8', borderWidth: 3, borderRadius: 5 },
      label: { color: chartText, fontSize: 10, formatter: '{b}\n{d}%' },
      data: (data.certifications || []).map(v => ({ name: certNames[v.name] || v.name || '其他', value: Number(v.value || 0) })) }]
  });
  Object.values(charts).forEach(chart => chart.resize());
}

async function refresh() {
  try {
    const res = await fetch(API + '/api/government/dashboard');
    const data = await res.json();
    renderCards(data.cards);
    renderCharts(data.charts);
    renderTicker(data.dynamics || []);
  } catch (e) {
    console.error('刷新失败', e);
  }
}
refresh();
setInterval(refresh, 60000);  // PRD:大屏数字随后台更新
</script>
</body>
</html>
